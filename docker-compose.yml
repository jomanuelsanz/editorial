version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: editorial_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: editorial_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - editorial_network

  app:
    build: .
    container_name: editorial_app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/editorial_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - editorial_network

volumes:
  mysql_data:

networks:
  editorial_network: