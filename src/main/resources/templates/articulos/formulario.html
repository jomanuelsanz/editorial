<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Artículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">Editorial</a>
    <div class="navbar-nav">
        <a class="nav-link" href="/web/revistas">Revistas</a>
        <a class="nav-link active" href="/web/articulos">Artículos</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0" th:text="${articulo.id == null} ? 'Nuevo Artículo' : 'Editar Artículo'"></h5>
                </div>
                <div class="card-body">
                    <form th:action="${articulo.id == null} ? '/web/articulos/nuevo' : '/web/articulos/editar/' + ${articulo.id}"
                          method="post">
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" name="titulo" class="form-control" th:value="${articulo.titulo}"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Autor</label>
                            <input type="text" name="autor" class="form-control" th:value="${articulo.autor}"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Número de páginas</label>
                            <input type="number" name="numeroPaginas" class="form-control" th:value="${articulo.numeroPaginas}"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha de publicación</label>
                            <input type="date" name="fechaPublicacion" class="form-control" th:value="${articulo.fechaPublicacion}"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Open Access</label>
                            <select name="openAccess" class="form-select">
                                <option value="true" th:selected="${articulo.openAccess == true}">Sí</option>
                                <option value="false" th:selected="${articulo.openAccess != true}">No</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Revista</label>
                            <select name="revista.id" class="form-select">
                                <option value="">Sin revista</option>
                                <option th:each="r : ${revistas}"
                                        th:value="${r.id}"
                                        th:text="${r.nombre}"
                                        th:selected="${articulo.revista != null and articulo.revista.id == r.id}">
                                </option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a href="/web/articulos" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
