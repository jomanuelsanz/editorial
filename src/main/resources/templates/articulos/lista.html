<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Artículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">Editorial</a>
    <div class="navbar-nav">
        <a class="nav-link" href="/web/revistas">Revistas</a>
        <a class="nav-link active" href="/web/articulos">Artículos</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Artículos</h1>
        <a href="/web/articulos/nuevo" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nuevo artículo
        </a>
    </div>

    <form method="get" action="/web/articulos" class="d-flex gap-2 mb-4">
        <input type="text" name="autor" class="form-control w-auto"
               placeholder="Buscar por autor..." th:value="${autor}"/>
        <select name="openAccess" class="form-select w-auto">
            <option value="">Todos</option>
            <option value="true" th:selected="${openAccess == true}">Open Access</option>
            <option value="false" th:selected="${openAccess == false}">No Open Access</option>
        </select>
        <button type="submit" class="btn btn-outline-secondary">
            <i class="bi bi-search"></i> Buscar
        </button>
        <a href="/web/articulos" class="btn btn-outline-secondary">Limpiar</a>
    </form>

    <div class="card shadow-sm">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Título</th><th>Autor</th><th>Páginas</th>
                    <th>Fecha</th><th>Open Access</th><th>Revista</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="articulo : ${articulos}">
                    <td class="fw-semibold" th:text="${articulo.titulo}"></td>
                    <td th:text="${articulo.autor}"></td>
                    <td th:text="${articulo.numeroPaginas}"></td>
                    <td th:text="${articulo.fechaPublicacion}"></td>
                    <td>
                        <span th:if="${articulo.openAccess}" class="badge bg-success">Sí</span>
                        <span th:unless="${articulo.openAccess}" class="badge bg-secondary">No</span>
                    </td>
                    <td th:text="${articulo.revista != null} ? ${articulo.revista.nombre} : '-'"></td>
                    <td>
                        <a th:href="@{/web/articulos/{id}(id=${articulo.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/web/articulos/editar/{id}(id=${articulo.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/web/articulos/borrar/{id}(id=${articulo.id})}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('¿Seguro que quieres borrar este artículo?')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(articulos)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay artículos registrados</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
