<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Revista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">Editorial</a>
    <div class="navbar-nav">
        <a class="nav-link active" href="/web/revistas">Revistas</a>
        <a class="nav-link" href="/web/articulos">Artículos</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0" th:text="${revista.nombre}"></h5>
            <a th:href="@{/web/revistas/editar/{id}(id=${revista.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-pencil"></i> Editar
            </a>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Temática</dt>
                <dd class="col-sm-9" th:text="${revista.tematica}"></dd>
                <dt class="col-sm-3">Periodicidad</dt>
                <dd class="col-sm-9" th:text="${revista.periodicidad}"></dd>
                <dt class="col-sm-3">ISSN</dt>
                <dd class="col-sm-9"><code th:text="${revista.issn}"></code></dd>
            </dl>
        </div>
    </div>

    <h5>Artículos de esta revista</h5>
    <div class="card shadow-sm mb-3">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Título</th><th>Autor</th><th>Páginas</th><th>Fecha</th><th>Open Access</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="articulo : ${revista.articulos}">
                    <td th:text="${articulo.titulo}"></td>
                    <td th:text="${articulo.autor}"></td>
                    <td th:text="${articulo.numeroPaginas}"></td>
                    <td th:text="${articulo.fechaPublicacion}"></td>
                    <td>
                        <span th:if="${articulo.openAccess}" class="badge bg-success">Sí</span>
                        <span th:unless="${articulo.openAccess}" class="badge bg-secondary">No</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(revista.articulos)}">
                    <td colspan="5" class="text-center text-muted py-3">Sin artículos</td>
                </tr>
            </tbody>
        </table>
    </div>

    <a href="/web/revistas" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>
</body>
</html>
